name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --disable-sandbox
      - name: Package app
        run: ./Scripts/package-app.sh
      - name: Verify package
        run: |
          codesign --verify --deep --strict dist.noindex/IslandNotes.app
          plutil -lint dist.noindex/IslandNotes.app/Contents/Info.plist
          shasum -a 256 -c dist.noindex/IslandNotes.zip.sha256
